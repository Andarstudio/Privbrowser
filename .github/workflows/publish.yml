name: Publish and Build Installer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore privbrowser/PrivBrowser.csproj

    - name: Publish Application
      run: |
        dotnet publish privbrowser/PrivBrowser.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -o ./publish

    - name: Generate Inno Setup Script
      shell: pwsh
      run: |
        $issContent = @'
        [Setup]
        AppName=PrivBrowser
        AppVersion=1.0
        DefaultDirName={autopf}\PrivBrowser
        DefaultGroupName=PrivBrowser
        OutputDir=Output
        OutputBaseFilename=PrivBrowser_Setup_x64
        SetupIconFile=app.ico
        Compression=lzma
        SolidCompression=yes

        [Files]
        Source: "..\publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

        [Icons]
        Name: "{group}\PrivBrowser"; Filename: "{app}\PrivBrowser.exe"; IconFilename: "{app}\app.ico"
        Name: "{autodesktop}\PrivBrowser"; Filename: "{app}\PrivBrowser.exe"; IconFilename: "{app}\app.ico"; Tasks: desktopicon

        [Tasks]
        Name: "desktopicon"; Description: "Create a &desktop icon"; GroupDescription: "Additional icons:"; Flags: unchecked
        '@
        Set-Content -Path "privbrowser/installer.iss" -Value $issContent

    - name: Compile Inno Setup Script
      uses: Minionguyjpro/Inno-Setup-Action@v1.2.9
      with:
        path: privbrowser/installer.iss
        options: /O+

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PrivBrowser-Release-win-x64
        path: |
          ./publish/
          privbrowser/Output/*.exe
          
