name: Build PrivBrowser Linux DEB

on:
  workflow_dispatch:
  push:
    paths:
      - "privbrowserdeb/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Ubuntu DEB
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Publish Linux application
        run: |
          dotnet publish \
            privbrowserdeb/PrivBrowser.Linux.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -o publish

      - name: Create Debian package
        run: |
          mkdir -p package/DEBIAN
          mkdir -p package/opt/privbrowser
          mkdir -p package/usr/bin

          cp -a publish/. package/opt/privbrowser/

          cat > package/DEBIAN/control <<'EOF'
          Package: privbrowser
          Version: 1.0.0
          Section: web
          Priority: optional
          Architecture: amd64
          Maintainer: Andar Studio
          Description: PrivBrowser Linux Edition
           PrivBrowser web browser for Ubuntu Linux.
          EOF

          cat > package/usr/bin/privbrowser <<'EOF'
          #!/bin/sh
          exec /opt/privbrowser/PrivBrowser.Linux "$@"
          EOF

          chmod 755 package/usr/bin/privbrowser

          dpkg-deb --root-owner-group --build package privbrowser-linux-amd64.deb

      - name: Upload DEB package
        uses: actions/upload-artifact@v6
        with:
          name: privbrowser-linux-amd64
          path: privbrowser-linux-amd64.deb
          if-no-files-found: error
