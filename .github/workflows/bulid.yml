name: Build PrivBrowser

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Find project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1

          if (-not $project) {
            Write-Error "No .csproj file found!"
            exit 1
          }

          Write-Host "Found project: $($project.FullName)"
          echo "PROJECT=$($project.FullName)" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore "$env:PROJECT"

      - name: Publish PrivBrowser
        run: |
          dotnet publish "$env:PROJECT" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Create Installer Script
        shell: pwsh
        run: |
          @"
          [Setup]
          AppName=PrivBrowser
          AppVersion=1.0.0
          DefaultDirName={autopf}\PrivBrowser
          DefaultGroupName=PrivBrowser
          OutputDir=installer
          OutputBaseFilename=PrivBrowser-Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64

          [Files]
          Source: "publish\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion

          [Icons]
          Name: "{group}\PrivBrowser"; Filename: "{app}\PrivBrowser.exe"
          Name: "{autodesktop}\PrivBrowser"; Filename: "{app}\PrivBrowser.exe"

          [Run]
          Filename: "{app}\PrivBrowser.exe"; Description: "Launch PrivBrowser"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -Encoding UTF8 PrivBrowser.iss

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PrivBrowser.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: PrivBrowser-Installer
          path: installer\PrivBrowser-Setup.exe
