name: Build and Release PrivBrowser

on:
  push:
    branches: [ "main", "master" ]
    tags: 
      - '1.0'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore privbrowser/PrivBrowser.csproj

    - name: Publish application
      run: dotnet publish privbrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained true --output privbrowser/publish

    - name: Zip Portable Version
      run: Compress-Archive -Path privbrowser/publish\* -DestinationPath PrivBrowser-Portable.zip

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Installer
      run: iscc privbrowser/installer.iss

    - name: Publish Release to GitHub
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          **/PrivBrowser-Setup.exe
          PrivBrowser-Portable.zip
        generate_release_notes: true
        
