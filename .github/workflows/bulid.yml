name: Build PrivBrowser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore privbrowser/PrivBrowser.csproj

    # 1. Publish multi-file folder for Inno Setup to package
    - name: Publish Folder (For Installer)
      run: dotnet publish privbrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained true --output privbrowser/publish

    # 2. Publish single standalone EXE for Direct Open
    - name: Publish Direct-Open EXE
      run: dotnet publish privbrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output privbrowser/direct-open

    # 3. Install Inno Setup compiler tool
    - name: Install Inno Setup
      run: choco install innosetup -y

    # 4. Compile installer script into Setup.exe
    - name: Compile Installer
      run: iscc privbrowser/installer.iss

    # 5. Upload both output formats as downloadable ZIP artifact
    - name: Upload Both Executables
      uses: actions/upload-artifact@v4
      with:
        name: PrivBrowser-Releases
        path: |
          privbrowser/direct-open/
          privbrowser/Output/*.exe
          
