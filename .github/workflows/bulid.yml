name: Build PrivBrowser Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: privbrowser-android
        run: gradle assembleDebug

      - name: Verify APK was produced
        shell: bash
        run: |
          apk=$(find privbrowser-android -name "*.apk" | head -n 1)
          if [ -z "$apk" ]; then
            echo "No APK found in build output."
            exit 1
          fi
          echo "Found APK: $apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivBrowser-Android-apk
          path: privbrowser-android/app/build/outputs/apk/debug/*.apk
