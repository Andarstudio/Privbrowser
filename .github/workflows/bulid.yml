name: Build PrivBrowser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore privbrowser/PrivBrowser.csproj

    - name: Build and Publish (Portable)
      run: dotnet publish privbrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained true --output privbrowser/publish

    - name: Install Inno Setup
      run: winget install JRSoftware.InnoSetup --silent --accept-source-agreements --accept-package-agreements

    - name: Compile Installer (.exe)
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        & $iscc privbrowser\installer.iss

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PrivBrowser-Releases
        path: |
          privbrowser/publish/
          privbrowser/Output/
