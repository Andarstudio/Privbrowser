name: Build PrivBrowser

on:
push:
workflow_dispatch:

jobs:
build:
runs-on: windows-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup .NET
    uses: actions/setup-dotnet@v4
    with:
      dotnet-version: "8.0.x"

  - name: Find project
    shell: pwsh
    run: |
      $project = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter "PrivBrowser.csproj" |
        Select-Object -First 1

      if (-not $project) {
        Write-Error "PrivBrowser.csproj not found."
        exit 1
      }

      Write-Host "Project: $($project.FullName)"
      "PROJECT=$($project.FullName)" >> $env:GITHUB_ENV

  - name: Restore
    run: dotnet restore "$env:PROJECT"

  - name: Build
    run: |
      dotnet build "$env:PROJECT" `
        --configuration Release `
        --no-restore `
        --runtime win-x64

  - name: Publish
    run: |
      dotnet publish "$env:PROJECT" `
        --configuration Release `
        --runtime win-x64 `
        --self-contained false `
        --no-restore `
        --output "$env:GITHUB_WORKSPACE\publish"

  - name: Check build
    shell: pwsh
    run: |
      Write-Host "===== PUBLISH DIRECTORY ====="
      Get-ChildItem "$env:GITHUB_WORKSPACE\publish" -Recurse

      $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\publish" -Filter "*.exe"

      if (-not $exe) {
        Write-Error "No EXE was created."
        exit 1
      }

      Write-Host "EXE found:"
      $exe | ForEach-Object {
        Write-Host $_.FullName
      }

  - name: Install Inno Setup
    shell: pwsh
    run: |
      choco install innosetup --yes --no-progress

  - name: Build installer
    shell: pwsh
    run: |
      if (-not (Test-Path "Installer\PrivBrowser.iss")) {
        Write-Error "Installer\PrivBrowser.iss not found."
        exit 1
      }

      New-Item -ItemType Directory -Force "InstallerOutput" | Out-Null

      & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
        "/O$env:GITHUB_WORKSPACE\InstallerOutput" `
        "Installer\PrivBrowser.iss"

      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }

  - name: Upload installer
    uses: actions/upload-artifact@v4
    with:
      name: PrivBrowser-Installer
      path: InstallerOutput\*.exe
      if-no-files-found: error

  - name: Upload portable build
    uses: actions/upload-artifact@v4
    with:
      name: PrivBrowser-Portable
      path: publish\**
      if-no-files-found: error
