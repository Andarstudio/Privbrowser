name: Build PrivBrowser

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet packages
      run: dotnet restore privbrowser/PrivBrowser.csproj

    - name: Publish application
      run: dotnet publish privbrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained true

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Build Installer
      run: iscc privbrowser/installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrivBrowser-Setup
        path: '**/PrivBrowser-Setup.exe'
        
