name: Build PrivBrowser

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Find project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Recurse -Filter *.csproj | Select-Object -First 1

          if (-not $project) {
            Write-Error "No .csproj file found!"
            exit 1
          }

          Write-Host "Found: $($project.FullName)"
          echo "PROJECT=$($project.FullName)" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore "$env:PROJECT"

      - name: Publish
        run: |
          dotnet publish "$env:PROJECT" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Download WebView2 Bootstrapper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path InstallerFiles | Out-Null

          Invoke-WebRequest `
            -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" `
            -OutFile "InstallerFiles\MicrosoftEdgeWebView2Setup.exe"

      - name: Build Installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "Installer\PrivBrowser.iss"

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: PrivBrowser-Installer
          path: InstallerOutput\PrivBrowser-Setup.exe
