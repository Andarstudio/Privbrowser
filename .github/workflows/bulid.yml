name: Build PrivBrowser

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore privbrowser/PrivBrowser.csproj

    # 1. Build folder version for Inno Setup Installer
    - name: Publish Folder (For Installer)
      run: dotnet publish privbrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained true --output privbrowser/publish

    # 2. Build Single Standalone EXE (Direct Open)
    - name: Publish Direct-Open EXE
      run: |
        dotnet publish privbrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output privbrowser/direct-open

    # 3. Compile Installer (.exe)
    - name: Compile Installer (.exe)
      uses: sandonascia/custom-inno-setup-action@v1
      with:
        filepath: 'privbrowser/installer.iss'

    # 4. Upload BOTH EXEs into the artifact
    - name: Upload Both Executables
      uses: actions/upload-artifact@v4
      with:
        name: PrivBrowser-Executables
        path: |
          privbrowser/direct-open/PrivBrowser.exe
          privbrowser/Output/*.exe
          
