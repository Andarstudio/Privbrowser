name: Build PrivBrowser

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore privbrowser/PrivBrowser.csproj

      - name: Build
        run: dotnet build privbrowser/PrivBrowser.csproj --configuration Release --no-restore

      - name: Publish self-contained Windows app
        shell: pwsh
        run: |
          dotnet publish privbrowser/PrivBrowser.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishDir="$env:GITHUB_WORKSPACE\privbrowser\publish"

      - name: Verify publish output
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\privbrowser\publish\PrivBrowser.exe")) {
            Write-Error "PrivBrowser.exe was not found in the publish directory."
          }
          Get-ChildItem "$env:GITHUB_WORKSPACE\privbrowser\publish" -Recurse

      - name: Install Inno Setup
        uses: jurplel/install-innosetup@v1

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "$env:GITHUB_WORKSPACE\privbrowser\installer.iss"

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: PrivBrowser-publish
          path: privbrowser/publish

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PrivBrowser-installer
          path: privbrowser/Setup files/PrivBrowser-Setup.exe
