name: Build PrivBrowser Linux

on:
  workflow_dispatch:
  push:
    paths:
      - "privbrowser-linux/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dotnet-sdk-8.0 \
            dpkg-dev \
            fakeroot

      - name: Publish Linux application
        run: |
          dotnet publish privbrowser-linux/PrivBrowser.Linux.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish

      - name: Create Debian package structure
        run: |
          mkdir -p package/DEBIAN
          mkdir -p package/opt/privbrowser
          mkdir -p package/usr/bin

          cp -a publish/. package/opt/privbrowser/

          cat > package/DEBIAN/control <<'EOF'
          Package: privbrowser
          Version: 1.0.0
          Section: web
          Priority: optional
          Architecture: amd64
          Maintainer: Andar Studio
          Description: PrivBrowser web browser
           Linux edition of PrivBrowser.
          EOF

          cat > package/usr/bin/privbrowser <<'EOF'
          #!/bin/sh
          exec /opt/privbrowser/PrivBrowser.Linux "$@"
          EOF

          chmod 755 package/usr/bin/privbrowser

      - name: Build DEB package
        run: |
          dpkg-deb --build package privbrowser-linux-amd64.deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: privbrowser-linux-deb
          path: privbrowser-linux-amd64.deb
