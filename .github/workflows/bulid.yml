name: Build PrivBrowser

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore privbrowser/PrivBrowser.csproj

      - name: Build
        run: dotnet build privbrowser/PrivBrowser.csproj -c Release --no-restore

      - name: Publish
        run: |
          dotnet publish privbrowser/PrivBrowser.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:PublishDir=publish

      - name: Install Inno Setup
        uses: jurplel/install-setup-action@v0
        # or install via choco if needed

      - name: Build installer
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' privbrowser\installer.iss
