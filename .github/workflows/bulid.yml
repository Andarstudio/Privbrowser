name: Build PrivBrowser

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Verify Project Exists
      shell: pwsh
      run: |
        if (!(Test-Path "privbrowser/PrivBrowser.csproj")) {
          Write-Error "Error: PrivBrowser.csproj not found in the expected path!"
          exit 1
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore NuGet Packages
      run: dotnet restore privbrowser/PrivBrowser.csproj

    - name: Publish PrivBrowser
      run: dotnet publish privbrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained true -o ./publish

    - name: Copy Icon to Publish Output
      shell: pwsh
      run: |
        if (Test-Path "privbrowser/app.ico") {
          Copy-Item "privbrowser/app.ico" -Destination "publish/"
        } else {
          Write-Error "Error: app.ico not found inside the privbrowser/ folder!"
          exit 1
        }

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Create Inno Setup Script
      shell: pwsh
      run: |
        $issContent = @"
        [Setup]
        AppName=PrivBrowser
        AppVersion=1.0.0
        AppPublisher=Andar Studio LLC
        DefaultDirName={autopf}\PrivBrowser
        DefaultGroupName=PrivBrowser
        OutputDir=.
        OutputBaseFilename=PrivBrowser-Setup
        SetupIconFile=privbrowser\app.ico
        Compression=lzma2
        SolidCompression=yes
        PrivilegesRequired=lowest

        [Languages]
        Name: "english"; MessagesFile: "compiler:Default.isl"

        [Files]
        Source: "publish\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

        [Icons]
        Name: "{group}\PrivBrowser"; Filename: "{app}\PrivBrowser.exe"; IconFilename: "{app}\app.ico"
        Name: "{autodesktop}\PrivBrowser"; Filename: "{app}\PrivBrowser.exe"; IconFilename: "{app}\app.ico"; Tasks: desktopicon

        [Tasks]
        Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked
        "@
        Set-Content -Path "installer.iss" -Value $issContent -Encoding UTF8

    - name: Build Installer with Inno Setup
      run: iscc installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrivBrowser-Setup
        path: PrivBrowser-Setup.exe
        
