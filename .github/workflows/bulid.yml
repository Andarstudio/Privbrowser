name: Build PrivBrowser exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'privbrowser/**'
      - 'installer/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish
        working-directory: privbrowser

      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: PrivBrowser-app
          path: privbrowser/publish

      - name: Compile installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        working-directory: installer
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PrivBrowser-Setup
          path: installer/Setup files/PrivBrowser-Setup.exe
