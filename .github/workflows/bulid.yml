name: Build PrivBrowser & Installer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore PrivBrowser/PrivBrowser.csproj

    - name: Publish Application (win-x64)
      run: dotnet publish PrivBrowser/PrivBrowser.csproj -c Release -r win-x64 --self-contained false -o ./publish

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Compile Inno Setup Installer
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" PrivBrowser/installer.iss
      shell: powershell

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PrivBrowser-Installer
        path: |
          PrivBrowser/Output/*.exe
          PrivBrowser/*.exe
          Output/*.exe
